# Render Blueprint for one-click deploy of the Clinic Booking API.
# After creating the Blueprint on Render, copy the web service's
# "Deploy Hook" URL and save it as the RENDER_DEPLOY_HOOK_URL secret
# in your GitHub repo settings so .github/workflows/deploy.yml can
# trigger deploys on merge to main.
services:
  - type: web
    name: clinic-booking-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: CLINIC_TIMEZONE
        value: Africa/Nairobi

databases:
  - name: clinic-booking-db
    plan: free
    region: oregon
    ipAllowList: []
